[project]
name = "cavla-research"
version = "0.1.0"
description = "Falsifiable pilots for intervention-conditioned representations in visual policies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
train = ["torch>=2.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
